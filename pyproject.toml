[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-toolkit"
version = "1.0.0"
description = "Zero-dependency CLI toolbox for network engineers: subnet math, VLSM planning, TCP scanning, DNS/HTTP/TLS diagnostics, OUI lookup and bandwidth calculators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jeremy da Costa", email = "357285436+jeremydacosta-TechOptimist@users.noreply.github.com" },
]
keywords = ["networking", "subnetting", "vlsm", "port-scanner", "dns", "tls", "cli", "network-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netops = "netops.cli:main"

[project.urls]
Homepage = "https://github.com/jeremydacosta-TechOptimist/netops-toolkit"
Issues = "https://github.com/jeremydacosta-TechOptimist/netops-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
